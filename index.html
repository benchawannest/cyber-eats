<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสั่งอาหารตามสั่ง - Cyber Eats</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    .modal-card { position: relative !important; }

    .close-modal-btn {
      all: unset !important;
      box-sizing: border-box !important;
      position: absolute !important;
      top: 18px !important;
      right: 18px !important;
      width: 36px !important;
      height: 36px !important;
      min-width: 36px !important;
      min-height: 36px !important;
      border-radius: 50% !important;
      background: rgba(255, 255, 255, 0.1) !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      color: #94A3B8 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      font-family: Arial, sans-serif !important;
      font-size: 20px !important;
      font-weight: bold !important;
      cursor: pointer !important;
      transition: all 0.2s ease !important;
      z-index: 10 !important;
    }

    .close-modal-btn:hover {
      background: #EF4444 !important;
      color: #FFFFFF !important;
      border-color: #EF4444 !important;
      transform: rotate(90deg) !important;
    }

    .table-select-group {
      margin: 15px 0;
      text-align: left;
      background: rgba(15, 23, 42, 0.6);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .table-select-group label {
      display: block;
      color: #94A3B8;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }

    .table-select-group select {
      width: 100%;
      padding: 10px 12px;
      background: #0B0F19;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #FFF;
      font-size: 1rem;
      outline: none;
      cursor: pointer;
    }

    .payment-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .payment-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #0B0F19;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #FFF;
    }

    .payment-option:hover {
      border-color: #EC4899;
      background: rgba(236, 72, 153, 0.05);
    }

    .payment-option input[type="radio"] {
      accent-color: #EC4899;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .order-summary-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 15px;
      text-align: left;
    }

    .order-summary-box h4 {
      color: #94A3B8;
      margin: 0 0 8px 0;
      font-size: 0.9rem;
    }

    .order-summary-list {
      color: #FFF;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .notify-card {
      text-align: center;
      padding: 24px 20px;
      max-width: 380px;
      margin: 0 auto;
    }

    .notify-icon { font-size: 3rem; margin-bottom: 12px; }
    .notify-title { font-size: 1.3rem; color: #FFF; margin-bottom: 8px; font-weight: bold; }
    .notify-desc { color: #94A3B8; font-size: 0.95rem; line-height: 1.6; margin-bottom: 20px; }

    .notify-details {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 20px;
      text-align: left;
      color: #E2E8F0;
      font-size: 0.9rem;
    }

    .notify-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #EC4899, #8B5CF6);
      color: #FFF;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .notify-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <header>
    <h1>ร้านอาหารตามสั่งมินิมอล</h1>
    <nav>
      <a href="index.html" class="active">หน้าสั่งอาหาร</a>
      <a href="admin.html">ระบบแอดมิน</a>
    </nav>
  </header>

  <div class="container">
    
    <!-- เมนูยอดนิยม -->
    <section class="popular-section" style="margin-bottom: 2.5rem;">
      <h2 style="color: #fff; font-size: 1.4rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
        🔥 เมนูยอดนิยมประจำร้าน
      </h2>
      
      <div class="popular-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
        <div class="card" style="background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 65, 108, 0.4);">
          <div class="card-img-wrapper">
            <span class="badge japanese">Japanese</span>
            <img src="https://lh3.googleusercontent.com/d/1VFaE6R9kC5ELQ8FYWyhxHa-WYY8r5myJ" alt="ข้าวหน้าแซลมอน" style="width:100%; height:140px; object-fit:cover;">
          </div>
          <div class="card-body" style="padding: 0.8rem;">
            <h3 style="font-size: 1.1rem; margin-bottom: 0.3rem;">ข้าวหน้าแซลมอน</h3>
          </div>
        </div>

        <div class="card" style="background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 65, 108, 0.4);">
          <div class="card-img-wrapper">
            <span class="badge korean">Korean</span>
            <img src="https://lh3.googleusercontent.com/d/1kDiaeSDRS5TxdG-Z2BQzhs6huv94SFCi" alt="ไก่ทอดเกาหลี" style="width:100%; height:140px; object-fit:cover;">
          </div>
          <div class="card-body" style="padding: 0.8rem;">
            <h3 style="font-size: 1.1rem; margin-bottom: 0.3rem;">ไก่ทอดซอสเกาหลี</h3>
          </div>
        </div>

        <div class="card" style="background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 65, 108, 0.4);">
          <div class="card-img-wrapper">
            <span class="badge thai">Thai</span>
            <img src="https://lh3.googleusercontent.com/d/1jtUjVG7SACFu6UW5DbFkC0pFu3cnRL0I" alt="กะเพรา" style="width:100%; height:140px; object-fit:cover;">
          </div>
          <div class="card-body" style="padding: 0.8rem;">
            <h3 style="font-size: 1.1rem; margin-bottom: 0.3rem;">ข้าวกระเพราหมูสับไข่ดาว</h3>
          </div>
        </div>
      </div>
    </section>

    <!-- ช่องค้นหา & ตัวกรอง -->
    <div class="filter-section" style="margin-bottom: 2rem;">
      <div class="search-box" style="margin-bottom: 1.2rem;">
        <input 
          type="text" 
          id="search-input" 
          placeholder="🔍 ค้นหาเมนูอาหาร..." 
          oninput="handleSearchAndFilter()"
          style="width: 100%; padding: 0.85rem 1.2rem; background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; color: #fff; font-size: 1rem; backdrop-filter: blur(10px); outline: none;"
        >
      </div>

      <div class="filters" style="display: flex; gap: 0.6rem; flex-wrap: wrap;">
        <button class="filter-btn active" onclick="setCategory('All', this)">✨ ทั้งหมด</button>
        <button class="filter-btn" onclick="setCategory('Thai', this)">🌶️ อาหารไทย</button>
        <button class="filter-btn" onclick="setCategory('Japanese', this)">🍱 อาหารญี่ปุ่น</button>
        <button class="filter-btn" onclick="setCategory('Korean', this)">🍗 อาหารเกาหลี</button>
      </div>
    </div>

    <!-- แสดงรายการอาหาร -->
    <div id="menu-grid" class="grid"></div>
  </div>

  <!-- ปุ่ม Pop-up ตะกร้าสินค้า -->
  <button class="cart-floating-btn" onclick="openModal('cart-modal')">
    🛒 ตะกร้าสินค้า (<span id="cart-count-badge">0</span>)
  </button>

  <!-- Pop-up ตะกร้าสินค้า -->
  <div id="cart-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <div class="title-group">
          <span class="icon">🛒</span>
          <h2>ตะกร้าสินค้าของคุณ</h2>
        </div>
        <button type="button" class="close-modal-btn" onclick="closeModal('cart-modal')">&times;</button>
      </div>

      <div id="cart-modal-items" class="modal-body"></div>

      <div class="table-select-group">
        <label for="table-number">🍽️ เลือกหมายเลขโต๊ะ:</label>
        <select id="table-number">
          <option value="">-- กรุณาเลือกโต๊ะ --</option>
          <option value="1">โต๊ะ 1</option>
          <option value="2">โต๊ะ 2</option>
          <option value="3">โต๊ะ 3</option>
          <option value="4">โต๊ะ 4</option>
          <option value="5">โต๊ะ 5</option>
          <option value="6">โต๊ะ 6</option>
          <option value="7">โต๊ะ 7</option>
          <option value="8">โต๊ะ 8</option>
        </select>
      </div>

      <div class="modal-footer">
        <div class="price-summary">
          <span>ราคารวมทั้งหมด</span>
          <span id="cart-modal-total" class="total-amount">฿0</span>
        </div>
        <div class="action-buttons">
          <button type="button" class="btn-secondary" onclick="closeModal('cart-modal')">เลือกอาหารเพิ่ม</button>
          <button type="button" class="btn-checkout" onclick="openPaymentModal()">ยืนยันการสั่งซื้อ ✨</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Pop-up ชำระเงิน -->
  <div id="payment-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <div class="title-group">
          <span class="icon">💳</span>
          <h2>เลือกช่องทางชำระเงิน</h2>
        </div>
        <button type="button" class="close-modal-btn" onclick="closeModal('payment-modal')">&times;</button>
      </div>

      <div class="modal-body">
        <div class="order-summary-box">
          <h4 id="payment-table-title">📍 โต๊ะ: -</h4>
          <div id="payment-items-summary" class="order-summary-list"></div>
        </div>

        <div class="payment-options">
          <label class="payment-option">
            <input type="radio" name="payment_method" value="เงินสด" checked>
            <span>💵 เงินสด (Cash)</span>
          </label>
          <label class="payment-option">
            <input type="radio" name="payment_method" value="พร้อมเพย์">
            <span>📱 สแกนจ่าย พร้อมเพย์ (PromptPay)</span>
          </label>
          <label class="payment-option">
            <input type="radio" name="payment_method" value="บัตรเครดิต/เดบิต">
            <span>💳 บัตรเครดิต / เดบิต (Credit / Debit Card)</span>
          </label>
        </div>
      </div>

      <div class="modal-footer">
        <div class="price-summary">
          <span>ยอดชำระสุทธิ</span>
          <span id="payment-modal-total" class="total-amount" style="color: #4ADE80;">฿0</span>
        </div>
        <div class="action-buttons">
          <button type="button" class="btn-secondary" onclick="closeModal('payment-modal'); openModal('cart-modal');">ย้อนกลับ</button>
          <button type="button" class="btn-checkout" onclick="submitFinalOrder()">ชำระเงินเรียบร้อย ✨</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Pop-up แจ้งเตือน -->
  <div id="notice-modal" class="modal-overlay">
    <div class="modal-card notify-card">
      <div id="notice-icon" class="notify-icon">⚠️</div>
      <div id="notice-title" class="notify-title">แจ้งเตือน</div>
      <div id="notice-desc" class="notify-desc">ข้อความแจ้งเตือน</div>
      <div id="notice-details" class="notify-details" style="display: none;"></div>
      <button type="button" class="notify-btn" onclick="closeModal('notice-modal')">ตกลง</button>
    </div>
  </div>

  <div id="toast" class="toast">
    <span class="toast-icon">✅</span>
    <span id="toast-message">แจ้งเตือน</span>
  </div>

  <script src="app.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (typeof loadCustomerMenus === 'function') {
        loadCustomerMenus('All');
      }
    });

    function showCustomNotice(title, desc, icon = '⚠️', detailsHtml = '') {
      document.getElementById('notice-icon').innerText = icon;
      document.getElementById('notice-title').innerText = title;
      document.getElementById('notice-desc').innerText = desc;
      
      const detailsBox = document.getElementById('notice-details');
      if (detailsHtml) {
        detailsBox.innerHTML = detailsHtml;
        detailsBox.style.display = 'block';
      } else {
        detailsBox.style.display = 'none';
      }

      openModal('notice-modal');
    }

    function openPaymentModal() {
      const tableSelect = document.getElementById('table-number');
      const selectedTable = tableSelect ? tableSelect.value : '';

      if (!selectedTable) {
        showCustomNotice('ยังไม่ได้เลือกโต๊ะ', 'กรุณาเลือกหมายเลขโต๊ะก่อนกดสั่งซื้อครับ', '🍽️');
        return;
      }

      closeModal('cart-modal');
      document.getElementById('payment-table-title').innerText = `📍 โต๊ะที่เลือก: โต๊ะ ${selectedTable}`;

      const cartTotal = document.getElementById('cart-modal-total').innerText;
      document.getElementById('payment-modal-total').innerText = cartTotal;

      const cartItemsContainer = document.getElementById('cart-modal-items');
      const summaryContainer = document.getElementById('payment-items-summary');
      if (cartItemsContainer && summaryContainer) {
        summaryContainer.innerHTML = cartItemsContainer.innerHTML;
      }

      openModal('payment-modal');
    }

    async function submitFinalOrder() {
      const selectedPayment = document.querySelector('input[name="payment_method"]:checked').value;
      const tableSelect = document.getElementById('table-number').value;

      if (typeof saveOrderToSupabase === 'function') {
        const isSuccess = await saveOrderToSupabase(tableSelect, selectedPayment);
        if (!isSuccess) return;
      }

      closeModal('payment-modal');

      const details = `
        <div><strong>โต๊ะ:</strong> โต๊ะ ${tableSelect}</div>
        <div><strong>วิธีชำระเงิน:</strong> ${selectedPayment}</div>
        <div style="color: #4ADE80; margin-top: 4px;"><strong>สถานะ:</strong> ส่งรายการเข้าห้องครัวแล้ว</div>
      `;

      showCustomNotice('สั่งซื้อสำเร็จ!', 'ขอบคุณที่ใช้บริการ Cyber Eats ครับ', '🎉', details);
    }
  </script>
</body>
</html>
